# =============================================================
# MUHAFIZ - PROJECT-WIDE GRADLE SETTINGS
# =============================================================
#
# Repository-level Android / Kotlin / Gradle configuration.
#
# Current toolchain:
#
# Gradle      8.13
# AGP         8.13.2
# Kotlin      2.3.21
# JDK         17
# compileSdk  36
# targetSdk   36
#
# IMPORTANT:
#
# JAVA_HOME and GRADLE_USER_HOME are intentionally NOT hardcoded
# here because machine-specific paths should not be committed
# into the repository.
#
# Current development machine:
#
# JAVA_HOME        = D:\JDK17
# GRADLE_USER_HOME = D:\GradleHome
#
# =============================================================


# -------------------------------------------------------------
# GRADLE JVM
# -------------------------------------------------------------
#
# Maximum heap available to the Gradle daemon.
#
# 2 GB is currently sufficient for Muhafiz.
# Increase only if the build produces actual heap/OOM errors.
#
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8


# -------------------------------------------------------------
# BUILD CACHE
# -------------------------------------------------------------
#
# Reuses outputs from compatible Gradle tasks.
#
# This reduces unnecessary recompilation and improves subsequent
# build performance.
#
org.gradle.caching=true


# -------------------------------------------------------------
# PARALLEL BUILD
# -------------------------------------------------------------
#
# Disabled intentionally.
#
# Muhafiz currently has a single primary Android application
# module, so parallel project execution provides little benefit.
#
# It can be reconsidered if the project becomes multi-module.
#
# org.gradle.parallel=true


# -------------------------------------------------------------
# CONFIGURATION CACHE
# -------------------------------------------------------------
#
# Disabled intentionally during the current release stabilization.
#
# Configuration Cache can improve Gradle startup time, but it
# should be enabled only after all plugins and custom build logic
# have been verified for compatibility.
#
# org.gradle.configuration-cache=true


# -------------------------------------------------------------
# ANDROIDX
# -------------------------------------------------------------
#
# Use AndroidX libraries.
#
android.useAndroidX=true


# -------------------------------------------------------------
# KOTLIN
# -------------------------------------------------------------
#
# Use the official Kotlin coding style.
#
kotlin.code.style=official


# -------------------------------------------------------------
# ANDROID RESOURCE NAMESPACING
# -------------------------------------------------------------
#
# Prevents a module's generated R class from including resources
# coming from dependency R classes.
#
# This produces smaller and cleaner R classes and prevents
# accidental transitive resource references.
#
android.nonTransitiveRClass=true